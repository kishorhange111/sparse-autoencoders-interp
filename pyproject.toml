[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-autoencoders-interp"
version = "0.1.0"
description = "Sparse autoencoders for mechanistic interpretability: TopK, BatchTopK and L1 SAEs with AuxK dead-latent revival; ground-truth recovery on a superposition toy model and CE-loss-recovered evaluation on GPT-2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
lm = ["transformers>=4.40", "datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
